services:
  agent-platform:
    build: .
    ports:
      - "3000:3000"
    env_file:
      # Optional: copy .env.example to .env to configure the LLM provider.
      - path: .env
        required: false
    environment:
      PORT: "3000"
      LOG_FORMAT: ${LOG_FORMAT:-pretty} # "json" shows what production/CloudWatch logs look like
      WORKSPACES_DIR: /workspaces
    volumes:
      - workspaces:/workspaces # task workspaces survive container restarts

volumes:
  workspaces:
